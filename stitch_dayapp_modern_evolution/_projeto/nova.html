<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "primary": "#45664b",
                    "inverse-surface": "#2f312e",
                    "inverse-on-surface": "#f1f1ed",
                    "surface-container-high": "#e8e8e4",
                    "inverse-primary": "#abd0af",
                    "tertiary-container": "#bf8992",
                    "cream-base": "#FDFBF7",
                    "primary-fixed": "#c7ecca",
                    "primary-fixed-dim": "#abd0af",
                    "on-primary-fixed-variant": "#2e4e35",
                    "sage-deep": "#5D7A61",
                    "tertiary-fixed": "#ffd9de",
                    "on-surface-variant": "#424842",
                    "on-error-container": "#93000a",
                    "surface": "#faf9f5",
                    "warm-clay": "#D9AE94",
                    "on-primary-container": "#16361f",
                    "soft-ink": "#3C403D",
                    "on-tertiary-fixed": "#321018",
                    "on-error": "#ffffff",
                    "surface-dim": "#dadad6",
                    "secondary-container": "#ffd87c",
                    "on-tertiary-container": "#4a242c",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f4f4f0",
                    "outline-variant": "#c2c8bf",
                    "surface-tint": "#45664b",
                    "on-background": "#1a1c1a",
                    "on-surface": "#1a1c1a",
                    "on-secondary-fixed": "#251a00",
                    "on-tertiary": "#ffffff",
                    "tertiary-fixed-dim": "#f2b7c1",
                    "secondary-fixed": "#ffdf96",
                    "on-secondary": "#ffffff",
                    "primary-container": "#7da082",
                    "on-primary-fixed": "#01210c",
                    "on-tertiary-fixed-variant": "#653a43",
                    "secondary-fixed-dim": "#e7c268",
                    "surface-variant": "#e3e3df",
                    "secondary": "#765a05",
                    "tertiary": "#80515a",
                    "on-secondary-fixed-variant": "#5a4400",
                    "on-secondary-container": "#795d08",
                    "surface-bright": "#faf9f5",
                    "background": "#faf9f5",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#727971",
                    "amber-glow": "#F4D35E",
                    "surface-container": "#eeeeea",
                    "sage-mist": "#CDE0C9",
                    "surface-container-highest": "#e3e3df"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "stack-gap": "20px",
                    "unit": "8px",
                    "container-margin": "24px",
                    "entry-padding": "32px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Noto Serif"],
                    "label-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-lg": ["Noto Serif"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "body-sm": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "headline-md": ["Noto Serif"],
                    "headline-sm": ["Noto Serif"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #faf9f5;
            color: #3C403D;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .zen-mode .shell-element {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
        }
        .zen-mode .writing-canvas {
            max-width: 800px;
            margin: 0 auto;
        }
        .mood-chip.active {
            background-color: #CDE0C9;
            box-shadow: 0 4px 12px rgba(69, 102, 75, 0.15);
        }
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-press:active {
            transform: scale(0.96);
        }
        textarea::placeholder, input::placeholder {
            color: #c2c8bf;
        }
        .save-ripple {
            position: relative;
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-unit bg-surface/80 backdrop-blur-md shell-element transition-all duration-500">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-sage-mist/20 rounded-full transition-colors flex items-center justify-center" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-sage-deep">Nova</h1>
</div>
<div class="flex items-center gap-3">
<button class="p-2 text-on-surface-variant hover:bg-sage-mist/20 rounded-full transition-all flex items-center gap-2 group" id="zenToggle">
<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>
<span class="font-label-lg text-label-lg hidden sm:block">Modo Zen</span>
</button>
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-6 py-2 rounded-full shadow-sm hover:opacity-90 transition-all btn-press save-ripple" id="saveBtn">
                Salvar
            </button>
</div>
</header>
<main class="flex-1 mt-20 px-container-margin pb-32 transition-all duration-500 writing-canvas">
<!-- Date Display -->
<div class="mb-8 opacity-60 shell-element">
<span class="font-label-sm text-label-sm tracking-widest uppercase" id="currentDate">Sábado, 24 de Maio</span>
</div>
<!-- Editor Area -->
<section class="flex flex-col gap-6">
<input autocomplete="off" class="w-full bg-transparent border-none p-0 font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg focus:ring-0 text-soft-ink placeholder-outline-variant transition-all" placeholder="Título da sua história..." type="text"/>
<textarea class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg min-h-[400px] focus:ring-0 text-soft-ink placeholder-outline-variant resize-none leading-relaxed" placeholder="Comece a escrever seus pensamentos aqui..." spellcheck="false"></textarea>
</section>
<!-- Mood Selection -->
<section class="mt-12 shell-element">
<h3 class="font-label-sm text-label-sm text-on-surface-variant mb-4 uppercase tracking-wider">Como você está se sentindo?</h3>
<div class="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
<button class="mood-chip flex-shrink-0 flex flex-col items-center gap-2 p-4 rounded-3xl bg-surface-container-low border border-outline-variant/10 transition-all hover:bg-sage-mist/20" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sentiment_very_satisfied">sentiment_very_satisfied</span>
<span class="font-label-sm text-label-sm">Radiante</span>
</button>
<button class="mood-chip flex-shrink-0 flex flex-col items-center gap-2 p-4 rounded-3xl bg-surface-container-low border border-outline-variant/10 transition-all hover:bg-sage-mist/20" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sentiment_satisfied">sentiment_satisfied</span>
<span class="font-label-sm text-label-sm">Calmo</span>
</button>
<button class="mood-chip flex-shrink-0 flex flex-col items-center gap-2 p-4 rounded-3xl bg-surface-container-low border border-outline-variant/10 transition-all hover:bg-sage-mist/20" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sentiment_neutral">sentiment_neutral</span>
<span class="font-label-sm text-label-sm">Neutro</span>
</button>
<button class="mood-chip flex-shrink-0 flex flex-col items-center gap-2 p-4 rounded-3xl bg-surface-container-low border border-outline-variant/10 transition-all hover:bg-sage-mist/20" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sentiment_dissatisfied">sentiment_dissatisfied</span>
<span class="font-label-sm text-label-sm">Pensativo</span>
</button>
<button class="mood-chip flex-shrink-0 flex flex-col items-center gap-2 p-4 rounded-3xl bg-surface-container-low border border-outline-variant/10 transition-all hover:bg-sage-mist/20" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sentiment_very_dissatisfied">sentiment_very_dissatisfied</span>
<span class="font-label-sm text-label-sm">Cansado</span>
</button>
</div>
</section>
<!-- Contextual Cards (Optional visual flair) -->
<section class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 shell-element">
<div class="p-entry-padding rounded-3xl bg-sage-mist/10 border border-sage-mist/30 flex items-start gap-4">
<span class="material-symbols-outlined text-sage-deep" data-icon="lightbulb">lightbulb</span>
<div>
<h4 class="font-label-lg text-label-lg text-sage-deep mb-1">Dica de Reflexão</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Pense sobre um pequeno momento de gratidão que você viveu hoje, por menor que seja.</p>
</div>
</div>
</section>
</main>
<!-- Toolbar - Bottom Sticky Shell -->
<footer class="fixed bottom-0 left-0 w-full z-40 shell-element transition-all duration-500">
<div class="mx-container-margin mb-container-margin glass-panel bg-surface/70 border border-outline-variant/20 rounded-full flex items-center justify-between p-2 shadow-lg max-w-2xl lg:mx-auto">
<div class="flex items-center gap-1 pl-2">
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-sage-mist/20" title="Foto">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-sage-mist/20" title="Vídeo">
<span class="material-symbols-outlined" data-icon="videocam">videocam</span>
</button>
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-sage-mist/20" title="Áudio">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<div class="w-px h-6 bg-outline-variant/30 mx-2"></div>
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-sage-mist/20" title="Etiquetas">
<span class="material-symbols-outlined" data-icon="sell">sell</span>
</button>
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center rounded-full hover:bg-sage-mist/20" title="Localização">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
</div>
<div class="pr-2">
<button class="bg-surface-container-high text-on-surface-variant p-3 rounded-full hover:bg-sage-mist/40 transition-colors flex items-center justify-center" id="toolbarZen">
<span class="material-symbols-outlined" data-icon="format_paint">format_paint</span>
</button>
</div>
</div>
</footer>
<!-- Hidden Zen Exit Button (Only visible in Zen Mode) -->
<button class="fixed top-8 right-8 z-50 opacity-0 pointer-events-none transition-all duration-500 bg-surface/50 backdrop-blur-md p-3 rounded-full hover:bg-surface border border-outline-variant/20" id="zenExit">
<span class="material-symbols-outlined" data-icon="close_fullscreen">close_fullscreen</span>
</button>
<script>
        // Set Current Date
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('currentDate').textContent = new Intl.DateTimeFormat('pt-BR', options).format(new Date());

        // Mood Selection Toggle
        function toggleMood(element) {
            document.querySelectorAll('.mood-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            
            // Haptic-like effect
            element.style.transform = 'scale(0.9)';
            setTimeout(() => element.style.transform = 'scale(1)', 100);
        }

        // Zen Mode Toggle
        const zenToggle = document.getElementById('zenToggle');
        const zenExit = document.getElementById('zenExit');
        const body = document.body;

        function enterZen() {
            body.classList.add('zen-mode');
            zenExit.classList.remove('opacity-0', 'pointer-events-none');
            zenExit.classList.add('opacity-100', 'pointer-events-auto');
        }

        function exitZen() {
            body.classList.remove('zen-mode');
            zenExit.classList.add('opacity-0', 'pointer-events-none');
            zenExit.classList.remove('opacity-100', 'pointer-events-auto');
        }

        zenToggle.addEventListener('click', enterZen);
        zenExit.addEventListener('click', exitZen);

        // Save Button Feedback
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined" data-icon="check">check</span> Salvo';
                this.classList.remove('bg-primary', 'opacity-80');
                this.classList.add('bg-sage-deep');
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.classList.add('bg-primary');
                    this.classList.remove('bg-sage-deep');
                }, 2000);
            }, 800);
        });

        // Typing Effect for Header Transparency
        const textarea = document.querySelector('textarea');
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm');
            } else {
                header.classList.remove('shadow-sm');
            }
        });
    </script>
</body></html>
