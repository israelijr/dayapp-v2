                Confirmar Seleção

<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('input[name="group-selection"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Remove visual selection from all
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('bg-sage-mist/10', 'border-primary/30');
                    const checkIcon = label.querySelector('.material-symbols-outlined.text-primary');
                    if(checkIcon) checkIcon.classList.add('hidden');
                });
                
                // Add to current
                if(this.checked) {
                    const parent = this.closest('label');
                    parent.classList.add('bg-sage-mist/10', 'border-primary/30');
                    const checkIcon = parent.querySelector('.material-symbols-outlined.text-primary');
                    if(checkIcon) checkIcon.classList.remove('hidden');
                }
            });
        });

        // Initial trigger for the checked one
        window.addEventListener('DOMContentLoaded', () => {
            const checked = document.querySelector('input[name="group-selection"]:checked');
            if(checked) {
                checked.dispatchEvent(new Event('change'));
            }
        });
    </script>
