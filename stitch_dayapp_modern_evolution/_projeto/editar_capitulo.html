<script>
        // Micro-interactions for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-sage-mist');
                input.parentElement.classList.remove('border-soft-ink/5');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-sage-mist');
                input.parentElement.classList.add('border-soft-ink/5');
            });
        });

        // Simple delete animation
        document.querySelectorAll('button[aria-label="Remover"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const card = this.closest('div.relative');
                card.style.transform = 'scale(0.9) opacity(0)';
                card.style.transition = 'all 0.3s ease';
                setTimeout(() => card.remove(), 300);
            });
        });
    </script>
