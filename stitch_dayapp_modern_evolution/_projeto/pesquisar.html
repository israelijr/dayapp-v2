        <script>
        // Micro-interaction for search input focus
        const searchInput = document.querySelector('input[type="text"]');
        const searchContainer = searchInput.parentElement;
        
        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('scale-[1.02]');
        });
        
        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('scale-[1.02]');
        });

        // Toggle Active State for chips (simulation)
        const chips = document.querySelectorAll('.filter-scroll button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-sage-mist', 'text-on-primary-container');
                    c.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
                chip.classList.add('bg-sage-mist', 'text-on-primary-container');
            });
        });
    </script>
