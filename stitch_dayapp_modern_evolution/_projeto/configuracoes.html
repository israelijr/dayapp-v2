        <script>
        // Simple micro-interaction for toggles
        document.querySelectorAll('.custom-toggle').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const parent = this.closest('div');
                if (this.checked) {
                    console.log('Preference Enabled');
                } else {
                    console.log('Preference Disabled');
                }
            });
        });

        // Theme switching simulation (visual only)
        const accentDots = document.querySelectorAll('.accent-dot');
        accentDots.forEach(dot => {
            dot.addEventListener('click', () => {
                accentDots.forEach(d => d.classList.remove('ring-2', 'ring-offset-2', 'ring-primary'));
                dot.classList.add('ring-2', 'ring-offset-2', 'ring-primary');
            });
        });
