<body class="bg-background text-on-surface selection:bg-sage-mist/40 transition-colors duration-500">
<!-- Top Navigation Anchor -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-4 bg-surface/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<button class="p-2 rounded-full hover:bg-sage-mist/20 transition-colors">
<a href="index.html" class="material-symbols-outlined text-soft-ink">arrow_back</a>
</button>
<h1 class="font-headline-sm text-headline-sm text-sage-deep">Nova História</h1>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" title="Exportar PDF">picture_as_pdf</span>
</button>

                Salvar

<main class="pt-24 pb-32 px-container-margin max-w-3xl mx-auto space-y-10">
<!-- Content Area: Title and Entry -->
<section class="space-y-6" id="editor-area">
<div class="space-y-2">
<input class="w-full bg-transparent border-none p-0 font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-soft-ink placeholder:text-outline-variant focus:ring-0" placeholder="Título da história..." type="text"/>
<div class="flex items-center gap-2 text-label-sm font-label-sm text-outline">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
<span id="current-date">Sexta-feira, 24 de Maio</span>
</div>
</div>
<div class="relative group">
<button class="absolute -right-2 -top-12 p-2 text-outline-variant hover:text-primary transition-colors focus:outline-none" id="focus-mode-toggle" title="Modo Foco">
<span class="material-symbols-outlined">open_in_full</span>
</button>
<textarea class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface-variant leading-relaxed placeholder:text-outline-variant/60 focus:ring-0 resize-none hide-scrollbar" id="main-textarea" placeholder="O que está na sua mente hoje?" rows="12"></textarea>
</div>
</section>
<!-- Emotional Context: Thermometer and Energy -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Thermometer Slider -->
<div class="bg-cream-base p-6 rounded-xl border border-soft-ink/10 shadow-sm space-y-4">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-soft-ink">Humor</label>
<span class="text-label-sm font-label-sm text-sage-deep bg-sage-mist/30 px-2 py-0.5 rounded-full" id="humor-label">Equilibrado</span>
</div>
<div class="px-2">
<input class="w-full h-2 bg-transparent appearance-none cursor-pointer" id="mood-slider" max="100" min="0" type="range" value="50"/>
</div>
<div class="flex justify-between text-[10px] font-label-sm text-outline uppercase tracking-wider">
<span>Calmo</span>
<span>Intenso</span>
</div>
</div>
<!-- Energy Level Chips -->
<div class="bg-cream-base p-6 rounded-xl border border-soft-ink/10 shadow-sm space-y-4">
<label class="font-label-lg text-label-lg text-soft-ink">Nível de Energia</label>
<div class="flex justify-between gap-2">
<button class="energy-chip flex-1 flex flex-col items-center py-2 rounded-lg border border-outline-variant hover:bg-sage-mist/10 transition-all" onclick="selectEnergy('low', this)">
<span class="material-symbols-outlined text-outline">battery_1_bar</span>
<span class="text-label-sm font-label-sm mt-1">Baixo</span>
</button>
<button class="energy-chip flex-1 flex flex-col items-center py-2 rounded-lg border border-outline-variant bg-sage-mist/30 border-primary transition-all" onclick="selectEnergy('normal', this)">
<span class="material-symbols-outlined text-primary">battery_4_bar</span>
<span class="text-label-sm font-label-sm mt-1">Normal</span>
</button>
<button class="energy-chip flex-1 flex flex-col items-center py-2 rounded-lg border border-outline-variant hover:bg-sage-mist/10 transition-all" onclick="selectEnergy('high', this)">
<span class="material-symbols-outlined text-outline">battery_full</span>
<span class="text-label-sm font-label-sm mt-1">Alto</span>
</button>
</div>
</div>
</section>
<!-- Tags Section -->

<span class="material-symbols-outlined text-sage-deep">sell</span>

</div>

<div class="flex items-center gap-1 bg-sage-mist/20 text-on-primary-fixed-variant px-3 py-1 rounded-full text-label-sm font-label-sm border border-sage-mist">
                    #reflexão <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span>
</div>
<div class="flex items-center gap-1 bg-warm-clay/10 text-on-secondary-fixed-variant px-3 py-1 rounded-full text-label-sm font-label-sm border border-warm-clay/30">

<input class="bg-transparent border-none p-0 text-label-sm font-label-sm text-soft-ink placeholder:text-outline-variant focus:ring-0 w-24" placeholder="Adicionar tag..." type="text"/>

<div class="absolute bottom-4 left-6 z-20">
<p class="text-white font-headline-sm text-headline-sm">Um espaço para você ser você.</p>
<p class="text-white/80 font-label-sm text-label-sm">Capturando momentos, um dia de cada vez.</p>
</div>
</section>
</main>
<!-- Media & Interaction Bar (Sticky) -->
<div class="fixed bottom-0 left-0 w-full px-4 pb-8 pt-2 z-50 pointer-events-none">
<div class="max-w-xl mx-auto glass-panel bg-white/70 border border-white/40 rounded-full px-4 py-3 shadow-[0_8px_32px_rgba(0,0,0,0.08)] flex justify-around items-center pointer-events-auto">
<button class="flex flex-col items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 text-soft-ink transition-all active:scale-95">
<span class="material-symbols-outlined">image</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 text-soft-ink transition-all active:scale-95">
<span class="material-symbols-outlined">videocam</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 text-soft-ink transition-all active:scale-95">
<span class="material-symbols-outlined">mic</span>
</button>
<div class="w-px h-6 bg-outline-variant/30 mx-1"></div>
<button class="flex flex-col items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 text-soft-ink transition-all active:scale-95">
<span class="material-symbols-outlined">sentiment_satisfied</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-full hover:bg-sage-mist/20 text-soft-ink transition-all active:scale-95">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</div>
<script>
        // Update current date
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('current-date').textContent = new Intl.DateTimeFormat('pt-BR', options).format(new Date());

        // Humor slider dynamic label
        const moodSlider = document.getElementById('mood-slider');
        const moodLabel = document.getElementById('humor-label');
        
        moodSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val < 25) moodLabel.textContent = "Melancólico";
            else if (val < 50) moodLabel.textContent = "Tranquilo";
            else if (val < 75) moodLabel.textContent = "Equilibrado";
            else moodLabel.textContent = "Vibrante";
        });

        // Energy selection logic
        function selectEnergy(type, el) {
            document.querySelectorAll('.energy-chip').forEach(btn => {
                btn.classList.remove('bg-sage-mist/30', 'border-primary');
                btn.querySelector('span:first-child').classList.replace('text-primary', 'text-outline');
            });
            el.classList.add('bg-sage-mist/30', 'border-primary');
            el.querySelector('span:first-child').classList.replace('text-outline', 'text-primary');
        }

        // Focus Mode Micro-interaction
        let isFocused = false;
        const focusToggle = document.getElementById('focus-mode-toggle');
        const editorArea = document.getElementById('editor-area');
        
        focusToggle.addEventListener('click', () => {
            isFocused = !isFocused;
            if (isFocused) {
                focusToggle.querySelector('span').textContent = 'close_fullscreen';
                // Hide other sections for focus
                document.querySelectorAll('section:not(#editor-area)').forEach(s => s.style.opacity = '0.1');
            } else {
                focusToggle.querySelector('span').textContent = 'open_in_full';
                document.querySelectorAll('section:not(#editor-area)').forEach(s => s.style.opacity = '1');
            }
        });

        // Atmospheric effect: gentle background drift
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 100;
            const moveY = (e.clientY - window.innerHeight / 2) / 100;
            document.body.style.backgroundPosition = `${moveX}px ${moveY}px`;
        });
    </script>
