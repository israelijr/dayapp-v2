<!DOCTYPE html>

<html lang="pt-BR"><head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>DayApp - Arquivar Memória</title>

              "colors": {

                      "on-tertiary": "#ffffff",

                      "on-error-container": "#93000a",

                      "on-secondary-fixed": "#251a00",
                      "surface-tint": "#45664b",
                      "on-tertiary-fixed": "#321018",
                      "primary-fixed": "#c7ecca",
                      "inverse-on-surface": "#f1f1ed",
                      "error": "#ba1a1a",
                      "surface-container-high": "#e8e8e4",
                      "on-tertiary-fixed-variant": "#653a43",
                      "primary": "#45664b",
                      "surface-container-highest": "#e3e3df",
                      "on-primary-container": "#16361f",
                      "on-secondary-fixed-variant": "#5a4400",
                      "on-tertiary-container": "#4a242c",
                      "surface": "#faf9f5",
                      "primary-fixed-dim": "#abd0af",
                      "surface-dim": "#dadad6",
                      "outline-variant": "#c2c8bf",
                      "sage-mist": "#CDE0C9",
                      "on-primary-fixed-variant": "#2e4e35",
                      "surface-variant": "#e3e3df",

        <style>
        .glass-overlay {
            backdrop-filter: blur(12px);
            background-color: rgba(250, 249, 245, 0.6);
        }
        .modal-shadow {
            box-shadow: 0 12px 40px -12px rgba(93, 122, 97, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #CDE0C9;
            border-radius: 10px;
        }
    </style>
        <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
    </head>
    <body class="bg-cream-base font-body-md text-soft-ink min-h-screen">
        <!-- Background Content (Simulated DayApp - Início) -->
        <div
            class="fixed inset-0 z-0 overflow-hidden opacity-40 grayscale-[0.2]">
            <!-- Top App Bar -->
            <header
                class="fixed top-0 left-0 w-full z-10 flex items-center justify-between px-container-margin h-16 bg-surface/80 backdrop-blur-md">
                <h1
                    class="font-headline-md text-headline-md text-soft-ink tracking-tight">DayApp</h1>
                <div class="flex gap-4">
                    <span
                        class="material-symbols-outlined text-soft-ink">menu</span>
                    <span
                        class="material-symbols-outlined text-soft-ink">account_circle</span>
                </div>
            </header>
            <!-- Mock Content Canvas -->
            <main class="pt-20 px-container-margin">
                <div class="mb-stack-gap">
                    <h2
                        class="font-headline-lg text-headline-lg text-primary mb-4">Minhas
                        Memórias</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div
                            class="bg-surface-container-low p-6 rounded-xl border border-soft-ink/5">
                            <div
                                class="w-full h-48 bg-sage-mist/20 rounded-lg mb-4"></div>
                            <div
                                class="h-4 w-3/4 bg-sage-mist/30 rounded mb-2"></div>
                            <div
                                class="h-4 w-1/2 bg-sage-mist/30 rounded"></div>
                        </div>
                        <div
                            class="bg-surface-container-low p-6 rounded-xl border border-soft-ink/5">
                            <div
                                class="w-full h-48 bg-sage-mist/20 rounded-lg mb-4"></div>
                            <div
                                class="h-4 w-2/3 bg-sage-mist/30 rounded mb-2"></div>
                            <div
                                class="h-4 w-3/4 bg-sage-mist/30 rounded"></div>
                        </div>
                    </div>
                </div>
            </main>
            <!-- Bottom Nav Bar -->
            <nav
                class="fixed bottom-0 left-0 w-full z-10 flex justify-around items-center px-6 pb-6 pt-2 bg-surface/70 backdrop-blur-xl border-t border-soft-ink/10">
                <span
                    class="material-symbols-outlined p-3 bg-sage-mist/30 text-primary rounded-full">home_app_logo</span>
                <span
                    class="material-symbols-outlined p-3 text-on-surface-variant">auto_stories</span>
                <span
                    class="material-symbols-outlined p-3 text-on-surface-variant">search</span>
                <span
                    class="material-symbols-outlined p-3 text-on-surface-variant">add_circle</span>
            </nav>
        </div>
        <!-- Modal Overlay -->
        <div
            class="fixed inset-0 z-[100] flex items-center justify-center p-container-margin glass-overlay">
            <div
                class="bg-surface-container-low w-full max-w-md rounded-[32px] modal-shadow overflow-hidden transform transition-all duration-300 scale-100 opacity-100"
                id="archive-modal">
                <!-- Modal Header / Decorative Element -->
                <div
                    class="h-2 w-16 bg-sage-mist/40 rounded-full mx-auto mt-4 mb-2"></div>
                <div class="px-8 pt-6 pb-10">
                    <!-- Icon & Headline -->
                    <div class="flex flex-col items-center text-center mb-8">
                        <div
                            class="w-16 h-16 bg-sage-mist/20 rounded-full flex items-center justify-center mb-4">
                            <span
                                class="material-symbols-outlined text-primary text-4xl"
                                data-weight="fill">archive</span>
                        </div>
                        <h2
                            class="font-headline-md text-headline-md text-soft-ink mb-3">Arquivar
                            Memória?</h2>
                        <p
                            class="font-body-md text-body-md text-on-surface-variant px-2 leading-relaxed">
                            Deseja mover esta memória para o arquivo? Ela
                            deixará de aparecer na sua linha do tempo principal.
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col gap-3">
                        <button
                            class="w-full bg-primary text-on-primary py-4 rounded-full font-label-lg text-label-lg hover:bg-sage-deep transition-all transform active:scale-[0.98] shadow-sm"
                            onclick="window.location.href='index.html'">
                            Arquivar
                        </button>
                        <button
                            class="w-full bg-transparent text-on-surface-variant py-4 rounded-full font-label-lg text-label-lg hover:bg-sage-mist/10 transition-all transform active:scale-[0.98]"
                            onclick="window.location.href='index.html'">
                            Cancelar
                        </button>
                    </div>
                </div>
                <!-- Subtle Visual Detail -->
                <div
                    class="relative h-24 w-full opacity-30 pointer-events-none">
                    <div
                        class="absolute -bottom-10 -right-10 w-40 h-40 bg-sage-mist/30 rounded-full blur-3xl"></div>
                    <div
                        class="absolute -bottom-10 -left-10 w-32 h-32 bg-warm-clay/20 rounded-full blur-3xl"></div>
                </div>
            </div>
        </div>
        <!-- Micro-interactions Script -->
        <script>
        function selectCategory(element) {
            // Remove active state from all chips
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.remove('bg-sage-mist/30', 'border-2', 'border-primary/20', 'text-primary', 'active-chip');
                chip.classList.add('bg-white', 'border', 'border-soft-ink/10', 'text-soft-ink');
            });
            
            // Add active state to selected chip
            element.classList.remove('bg-white', 'border', 'border-soft-ink/10', 'text-soft-ink');
            element.classList.add('bg-sage-mist/30', 'border-2', 'border-primary/20', 'text-primary', 'active-chip');
        }

        // Simple enter animation
        window.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('archive-modal');
            modal.style.opacity = '0';
            modal.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                modal.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                modal.style.opacity = '1';
                modal.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });
    </script>
    </body></html>
