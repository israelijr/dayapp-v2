<!-- Scripts for micro-interactions -->
<script>
        // Simple ripple effect or active state handling
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Potential for haptic or visual feedback
            });
        });

        // Icon Selection Logic
        const iconButtons = document.querySelectorAll('.flex.gap-4 button:not(:first-child)');
        iconButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Clear active states
                iconButtons.forEach(b => {
                    const circle = b.querySelector('div');
                    const label = b.querySelector('span:last-child');
                    const icon = b.querySelector('.material-symbols-outlined');
                    
                    circle.classList.remove('bg-primary-container', 'text-on-primary-container', 'scale-110');
                    circle.classList.add('bg-sage-mist/30', 'text-primary');
                    label.classList.remove('text-primary', 'font-bold');
                    label.classList.add('text-on-surface-variant');
                    icon.style.fontVariationSettings = "'FILL' 0";
                });

                // Set active state
                const circle = btn.querySelector('div');
                const label = btn.querySelector('span:last-child');
                const icon = btn.querySelector('.material-symbols-outlined');

                circle.classList.add('bg-primary-container', 'text-on-primary-container', 'scale-110');
                circle.classList.remove('bg-sage-mist/30', 'text-primary');
                label.classList.add('text-primary', 'font-bold');
                label.classList.remove('text-on-surface-variant');
                icon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
