<body class="bg-background text-on-background font-body-md overflow-x-hidden selection:bg-sage-mist selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/80 backdrop-blur-xl flex justify-between items-center px-container-margin py-4">
<div class="flex items-center gap-4">


<a href="colecoes.html" aria-label="Close" class="p-2 rounded-full hover:bg-sage-mist/20 transition-all active:scale-95 text-on-surface-variant">

<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Novo Capítulo</h1>
</div>
<button class="bg-sage-deep text-white px-6 py-2 rounded-full font-label-lg hover:brightness-110 transition-all active:scale-95 shadow-lg shadow-sage-deep/20">
            Criar
        </button>
</header>
<!-- Main Canvas -->
<main class="pt-24 pb-12 px-container-margin max-w-2xl mx-auto min-h-screen flex flex-col gap-12">
<!-- Chapter Title Input Section -->
<section class="mt-8">
<input autofocus="" class="w-full bg-transparent border-none p-0 font-headline-lg text-headline-lg-mobile md:text-headline-lg text-soft-ink placeholder:text-outline-variant focus:ring-0" placeholder="Dê um nome a este período..." type="text"/>
</section>
<!-- Period Selection Section -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-sm text-headline-sm text-soft-ink">Período</h2>
<div class="grid grid-cols-2 gap-4">
<div class="relative group">
<label class="absolute -top-2 left-4 bg-background px-1 text-label-sm font-label-sm text-outline z-10">Início</label>
<div class="flex items-center gap-3 bg-cream-base p-4 rounded-xl border border-soft-ink/10 group-focus-within:border-sage-deep transition-all">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<input class="w-full bg-transparent border-none p-0 text-body-md text-soft-ink focus:ring-0" placeholder="Jan 2024" type="text"/>
</div>
</div>
<div class="relative group">
<label class="absolute -top-2 left-4 bg-background px-1 text-label-sm font-label-sm text-outline z-10">Término</label>
<div class="flex items-center gap-3 bg-cream-base p-4 rounded-xl border border-soft-ink/10 group-focus-within:border-sage-deep transition-all">
<span class="material-symbols-outlined text-primary">event</span>
<input class="w-full bg-transparent border-none p-0 text-body-md text-soft-ink focus:ring-0" placeholder="Presente" type="text"/>
</div>
</div>
</div>
</section>
<!-- Chapter Cover Section -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-sm text-headline-sm text-soft-ink">Capa do Capítulo</h2>
<div class="relative w-full aspect-[16/9] border-2 border-dashed border-outline-variant rounded-3xl bg-cream-base/50 hover:bg-sage-mist/10 transition-all cursor-pointer flex flex-col items-center justify-center gap-4 group" id="drop-area">
<div class="w-16 h-16 rounded-full bg-sage-mist/20 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl">photo_camera</span>
</div>
<div class="text-center">
<p class="font-label-lg text-label-lg text-soft-ink">Selecionar Imagem de Capa</p>
<p class="text-label-sm font-label-sm text-outline mt-1">Formatos sugeridos: JPG, PNG até 5MB</p>
</div>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
<!-- Quick Suggestions Chips -->

</section>

<h2 class="font-headline-sm text-headline-sm text-soft-ink">Atmosfera</h2>
<textarea class="w-full bg-cream-base border border-soft-ink/10 rounded-2xl p-6 text-body-md text-soft-ink placeholder:text-outline-variant focus:border-sage-deep focus:ring-0 min-h-[120px] transition-all resize-none" placeholder="Descreva brevemente o sentimento deste novo ciclo..."></textarea>

<!-- Visual Embellishments -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-sage-mist/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="fixed top-1/2 -right-24 w-64 h-64 bg-secondary-fixed/10 blur-[80px] rounded-full pointer-events-none"></div>
<script>
        // Simple micro-interaction for the upload area
        const dropArea = document.getElementById('drop-area');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.classList.add('bg-sage-mist/30', 'border-sage-deep');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.classList.remove('bg-sage-mist/30', 'border-sage-deep');
            }, false);
        });

        // Basic form completion simulation
        document.querySelector('button.bg-sage-deep').addEventListener('click', () => {
            const titleInput = document.querySelector('input[type="text"]');
            if (titleInput.value.trim() === "") {
                titleInput.classList.add('placeholder:text-error');
                setTimeout(() => titleInput.classList.remove('placeholder:text-error'), 2000);
            } else {
                alert('Iniciando seu novo capítulo: ' + titleInput.value);
            }
        });
    </script>
