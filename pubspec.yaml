name: dayapp
description: "Um aplicativo para registrar suas memórias."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Define a versão da aplicação.
version: 1.0.17+23

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  sqflite: ^2.3.2
  path_provider: ^2.1.2
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: 9.2.4
  path: ^1.8.3
  uuid: ^4.3.3
  image_picker: ^1.1.1
  flutter_image_compress: ^2.3.0
  url_launcher: ^6.1.10
  share_plus: ^12.0.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.1.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_slidable: ^4.0.3
  file_selector: ^1.1.0
  audioplayers: ^6.1.0
  record: ^6.2.1
  video_player: ^2.9.2
  file_picker: ^11.0.2
  table_calendar: ^3.1.2
  local_auth: ^3.0.1
  archive: ^4.0.9
  crypto: ^3.0.3
  flutter_quill: ^11.0.0
  vsc_quill_delta_to_html: ^1.0.2
  in_app_purchase: ^3.2.0
  animations: ^2.0.11
  google_fonts: ^8.1.0
  image: ^4.8.0
  mailer: ^7.1.0
  flutter_timezone: ^5.0.1
  package_info_plus: ^9.0.1

dependency_overrides:
  intl: ^0.20.2
  flutter_secure_storage: ^10.2.0
  sqflite_common_ffi_web: ^1.1.1
  package_info_plus: ^9.0.1
  mailer: ^7.1.0
  flutter_timezone: ^5.0.1
  animations: ^2.0.11
  google_fonts: ^8.1.0
  image: ^4.8.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  path_provider_platform_interface: ^2.1.2
  # pacote para geração automática de localizações (opcional)

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_round: "assets/icon/icon.png"

# Configuração do Native Splash Screen
# Apenas cor sólida - a splash bonita é feita pelo Flutter
# Isso evita duas splashes diferentes e garante transição suave
flutter_native_splash:
  color: "#F5E8FA"
  color_dark: "#1A1A2E"
  
  # Android 12+ - apenas cor, sem ícone
  android_12:
    color: "#F5E8FA"
    color_dark: "#1A1A2E"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/image/
    - assets/icon/
    - assets/emojis.json
    - assets/adi-registration.properties
    - assets/fonts/PlusJakartaSans-Regular.ttf
    - assets/fonts/PlusJakartaSans-Medium.ttf
    - assets/fonts/PlusJakartaSans-SemiBold.ttf
    - assets/fonts/PlusJakartaSans-Bold.ttf
    - assets/fonts/PlusJakartaSans-Italic.ttf
    - assets/fonts/NotoSerif-Regular.ttf
    - assets/fonts/NotoSerif-Medium.ttf
    - assets/fonts/NotoSerif-SemiBold.ttf
    - assets/fonts/NotoSerif-Bold.ttf
    - assets/fonts/PlayfairDisplay-Regular.ttf
    - assets/fonts/PlayfairDisplay-Medium.ttf
    - assets/fonts/PlayfairDisplay-SemiBold.ttf
    
